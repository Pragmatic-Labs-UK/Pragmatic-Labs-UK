name: Master README Compiler Engine

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  compile-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Compile Template into README.md
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          GRAPH_HTML='<img src="./profile-3d-contrib/profile-night-view.svg" alt="Dynamic 3D Contribution Map" width="100%" />'
          
          # Replace hooks in README.md.template and save as README.md
          sed "s|<!-- 3D_GRAPH -->|$GRAPH_HTML|g" README.md.template > README.md
          sed -i "s|{{LAST_UPDATED}}|$NOW|g" README.md

      - name: Commit & Push Compiled Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md profile-3d-contrib/
          git commit -m "build(telemetry): auto-compiled master profile README" || exit 0
          git push
