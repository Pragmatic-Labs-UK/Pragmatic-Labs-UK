name: Master Profile Generator

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Render 3D Isometric Graph
      - name: Render 3D Isometric Map
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 2. Render Full Dynamic Master Cards (Updated Parameter Syntax)
      - name: Render Full Telemetry Cards
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Pragmatic-Labs-UK
          template: classic
          base: header, activity, community, repositories, metadata
          theme: dark
          padding: 0, 8%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_sections: most-used

      # 3. Compile Master README automatically
      - name: Assemble README
        run: |
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat << 'EOF' > README.md
          <div align="center">

          <!-- HEADER TYPING SVG -->
          <img src="https://readme-typing-svg.demolab.com?font=Fira+Code&weight=600&size=26&pause=1000&color=00E5FF&center=true&vcenter=true&width=600&lines=System+Initialized...;Welcome+to+PragmaticLabs;Architecting+High-Performance+Nodes;Secure+Authentication+Frameworks" alt="Typing SVG" />

          <br/><br/>

          <!-- STATUS BADGES -->
          <img src="https://img.shields.io/badge/STATUS-ACTIVE_DEVELOPMENT-00E5FF?style=for-the-badge&logo=github&logoColor=black" />
          <img src="https://img.shields.io/badge/NODE-ELECTRON_%7C_SYSTEMS_%7C_API-0066FF?style=for-the-badge&logo=electron&logoColor=white" />
          <img src="https://img.shields.io/badge/SECTOR-UNITED_KINGDOM-06D6A0?style=for-the-badge&logo=googlemaps&logoColor=black" />

          <br/><br/>

          <!-- CONTACT BUTTONS -->
          <a href="mailto:PragmaticLabsUK@hotmail.com">
            <img src="https://img.shields.io/badge/Request_Consultation-00E5FF?style=for-the-badge&logo=microsoftoutlook&logoColor=black" />
          </a>
          <a href="https://github.com/Pragmatic-Labs-UK?tab=repositories">
            <img src="https://img.shields.io/badge/Explore_Repositories-0066FF?style=for-the-badge&logo=github&logoColor=white" />
          </a>

          </div>

          ---

          ### ⬛ SYSTEM.ABOUT // PRAGMATICLABS

          > **Engineering robust, scalable software architectures.** Specializing in cross-platform systems, high-performance desktop applications, game engine tooling, and enterprise-grade security protocols.

          ---

          ### ⬛ SYSTEM.ACTIVITY // 3D ISOMETRIC TELEMETRY

          <div align="center">
            <a href="https://github.com/Pragmatic-Labs-UK">
              <img src="./profile-3d-contrib/profile-night-view.svg" alt="3D Isometric Map" width="100%" />
            </a>
          </div>

          ---

          ### ⬛ SYSTEM.TELEMETRY // AUTOMATED METRICS MATRIX

          <div align="center">
            <a href="https://github.com/Pragmatic-Labs-UK">
              <img src="./github-metrics.svg" alt="Automated Metrics" width="100%" />
            </a>
          </div>

          ---

          <div align="center">
            <sub><b>OPERATING SECTOR:</b> UNITED KINGDOM • PRAGMATIC CONSULTANCY LIMITED</sub><br/>
            <sub><b>AUTOMATED PIPELINE COMPILATION:</b> EOF_TIMESTAMP</sub>
          </div>
          EOF

          # Inject current UTC timestamp
          sed -i "s|EOF_TIMESTAMP|$NOW|g" README.md

      - name: Commit & Push Fully Generated README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md profile-3d-contrib/ github-metrics.svg || true
          git commit -m "build(system): automated master readme generation" || exit 0
          git push
